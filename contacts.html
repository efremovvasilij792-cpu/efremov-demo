<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Контакты | Мастерская В.Ю. Ефремова</title>
  <meta name="description" content="Мастерская В.Ю. Ефремова: Московская область, Ступинский район, Михнево, ул. Донбасская, 75. Телефон 8 (926) 962-80-22.">
  <link rel="icon" href="assets/img/site/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body data-page="contacts">

<main>
  <div class="hero-wrap">
    <section class="hero page-hero">
      <div class="hero-media"><div class="kb"><img src="assets/img/site/bg4.webp" alt="" style="object-position:50% 60%"></div></div>
      <div class="hero-content">
        <h1><span class="split-line"><span>Контакты</span></span></h1>
        <p class="reveal" data-delay="2">Приезжайте в мастерскую, звоните или оставьте заявку — ответим, поможем с выбором и рассчитаем доставку.</p>
      </div>
    </section>
  </div>

  <section class="section" style="padding-top:56px">
    <div class="container contact-grid">
      <div style="display:grid;gap:20px">
        <div class="contact-grid" style="gap:20px" id="cards"></div>
        <div class="panel reveal" style="border-radius:24px">
          <h3 style="font-size:34px">Обратная связь</h3>
          <p class="muted" style="margin-top:6px">Оставьте контакты — мастер перезвонит.</p>
          <button class="btn btn-dark" style="margin-top:20px" data-open-form>Заполнить форму <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="map reveal">
        <iframe title="Карта: мастерская в Михнево" loading="lazy"
          src="https://yandex.ru/map-widget/v1/?text=%D0%9C%D0%B8%D1%85%D0%BD%D0%B5%D0%B2%D0%BE%2C%20%D0%94%D0%BE%D0%BD%D0%B1%D0%B0%D1%81%D1%81%D0%BA%D0%B0%D1%8F%2075&z=15"></iframe>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js?v=5"></script>
<script src="assets/js/app.js?v=5"></script>
<script>
  const c = [
    [ICON.phone, 'Телефон', `<a href="${SITE.phoneHref}">${SITE.phone}</a>`, 'Звоните или пишите в мессенджеры'],
    [ICON.mail, 'Почта', `<a href="mailto:${SITE.email}" style="font-size:24px">${SITE.email}</a>`, 'Пришлём расчёт и фото изделий'],
    [ICON.clock, 'Время работы', '8:00 – 22:00', 'Приём заявок ежедневно. ' + SITE.workshopHours],
    [ICON.pin, 'Адрес мастерской', 'Михнево, Донбасская, 75', 'Московская обл., Ступинский район']
  ];
  document.getElementById('cards').innerHTML = c.map(([ic, h, v, s], i) => `
    <div class="contact-card reveal" data-delay="${i % 2}">
      <div class="ic">${ic}</div><h3>${h}</h3><div class="v">${v}</div><p class="muted" style="font-size:14px">${s}</p>
    </div>`).join('');
</script>
</body>
</html>
